workflows:
  kick-lite-apk:
    name: Kick Lite - Android APK
    max_build_duration: 60

    environment:
      java: 17
      vars:
        GRADLE_VERSION: "8.2"
        KEYSTORE_PASSWORD: "kicklite-pass"
        KEY_PASSWORD: "kicklite-pass"
        KEY_ALIAS: "kicklite"
        KICK_API_BASE_URL: "https://api.kick.com/"
        KICK_OAUTH_GATEWAY_URL: "https://kick.boy82102.workers.dev"
        KICK_CLIENT_ID: "01M49PCKJNDH3XN0DTA53XYXXK"

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build signed release APK
        script: |
          set -e

          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-${GRADLE_VERSION}/bin:$PATH"

          export KEYSTORE_PATH="$CM_BUILD_DIR/kicklite-release.keystore"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Kick Lite, OU=Mobile, O=Kick Lite, C=US"

          gradle --no-daemon clean assembleRelease

          test -f app/build/outputs/apk/release/app-release.apk

    artifacts:
      - app/build/outputs/apk/release/app-release.apk
